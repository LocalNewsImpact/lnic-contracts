# The suite's CI pattern, in one place.
#
# WHY THE JOBS CALL `make`
# -----------------------
# Every stage runs a make target, and nothing else. Not `ruff check .`,
# not `pytest -m ...` -- `make lint`, `make test`. The commands live in
# each repository's Makefile, which is also what a person runs on their
# own machine, so CI and a local run cannot mean different things.
#
# That is the failure this exists to end. On 2026-09-04 a crawler pull
# request failed on an integration test that could not be run locally at
# all: an autouse fixture wrote the ORM schema into whatever DATABASE_URL
# named, so alembic then failed, so nobody ran them, so a broken test
# reached CI. The tests were fine. The absence of one command that meant
# the same thing in both places was not.
#
# WHAT IS SHARED AND WHAT IS NOT
# ------------------------------
# Shared: the stages, their order, the Postgres service, the Python
# version, the coverage floor, and the rule that each stage is a make
# target.
#
# Not shared: what the targets do. The crawler runs its tests inside a
# prebuilt image because its dependencies take minutes to install;
# datadesk installs them on the runner because they take seconds. Both
# are `make test`.
#
# PERMISSIONS ARE THE CALLER'S
# ----------------------------
# No `permissions` block here, on purpose. A called workflow can only
# narrow what its caller granted, never widen it, and a block that
# names `contents: read` is a ceiling every caller then has to fit
# under. The crawler's `install` pulls a private image from GHCR, which
# needs `packages: read`; had this file pinned `contents: read`, that
# call would fail with "requesting packages: read, but is only allowed
# packages: none" and no edit to the crawler could fix it.
#
# So each repository declares what its stages need at the call site --
# `contents: read` for one that installs from PyPI, plus `packages:
# read` for one that pulls an image -- and these jobs run with that.
name: Python checks

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.11"
      postgres-image:
        description: The Postgres the tests run against. Match production.
        required: false
        type: string
        default: "postgres:16"
      postgres-db:
        required: false
        type: string
        default: "test"
      typecheck:
        description: >-
          Run `make typecheck` as its own stage. Repositories that fold
          mypy into `make lint` leave this off.
        required: false
        type: boolean
        default: false
      integration:
        description: >-
          Run `make test-integration` after the unit tests. Off where a
          repository has none; a target that does not exist must not be
          silently skipped.
        required: false
        type: boolean
        default: false
      fetch-tags:
        description: >-
          Check out the repository's tags as well as its files.

          Off by default because most stages do not need them and a tag
          fetch is not free. On where a repository TESTS something about
          its tags: the Source Directory asserts that the version in
          pyproject is not one already released, and with the default
          shallow checkout that test found no tags, returned early and
          passed -- so main sat in exactly the state the test exists to
          prevent, green, for as long as nobody ran it locally.
        required: false
        type: boolean
        default: false
      install:
        description: >-
          How to install what the make targets need, when they do not
          provision it themselves. Run before every stage, with
          GITHUB_TOKEN in its environment, so a repository whose stages
          run inside a private image can log in and pull it (`make
          ci-image`). The caller grants `packages: read` for that.
        required: false
        type: string
        default: "make setup"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: ${{ inputs.fetch-tags }}
          # `fetch-tags` needs history to hang the tags on; 0 is the
          # documented pairing. Kept at the default depth otherwise, so a
          # repository that does not ask for tags pays nothing.
          #
          # QUOTED, and it matters. GitHub expressions treat the number 0
          # as falsy, so `x && 0 || 1` evaluates to 1 whatever x is: the
          # checkout stayed shallow, no tags arrived, and `fetch-tags:
          # true` did nothing at all. '0' is a non-empty string and
          # therefore truthy, so the branch survives.
          fetch-depth: ${{ inputs.fetch-tags && '0' || '1' }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - run: ${{ inputs.install }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: make lint

  typecheck:
    name: typecheck
    if: inputs.typecheck
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: ${{ inputs.fetch-tags }}
          # `fetch-tags` needs history to hang the tags on; 0 is the
          # documented pairing. Kept at the default depth otherwise, so a
          # repository that does not ask for tags pays nothing.
          #
          # QUOTED, and it matters. GitHub expressions treat the number 0
          # as falsy, so `x && 0 || 1` evaluates to 1 whatever x is: the
          # checkout stayed shallow, no tags arrived, and `fetch-tags:
          # true` did nothing at all. '0' is a non-empty string and
          # therefore truthy, so the branch survives.
          fetch-depth: ${{ inputs.fetch-tags && '0' || '1' }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - run: ${{ inputs.install }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: make typecheck

  test:
    name: test
    needs: lint
    runs-on: ubuntu-latest
    # Production is Postgres, so the tests are. Two repositories ran on
    # SQLite and it accepted SQL Postgres refuses: `?|` on a text column
    # and DISTINCT over a `json` column both reached production green.
    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ inputs.postgres-db }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: ${{ inputs.postgres-db }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: ${{ inputs.fetch-tags }}
          # `fetch-tags` needs history to hang the tags on; 0 is the
          # documented pairing. Kept at the default depth otherwise, so a
          # repository that does not ask for tags pays nothing.
          #
          # QUOTED, and it matters. GitHub expressions treat the number 0
          # as falsy, so `x && 0 || 1` evaluates to 1 whatever x is: the
          # checkout stayed shallow, no tags arrived, and `fetch-tags:
          # true` did nothing at all. '0' is a non-empty string and
          # therefore truthy, so the branch survives.
          fetch-depth: ${{ inputs.fetch-tags && '0' || '1' }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - run: ${{ inputs.install }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: make test

      # The suite's coverage floor, from this workflow's own commit. It is
      # the file every repository's `make test` runs locally
      # (lnic_contracts.coverage_floor), taken here from the commit the
      # caller's `@ci-vN` resolved to rather than from whatever version of
      # the package the repository installed, so the number CI enforces is
      # the one this tag ships. A repository sets no floor of its own;
      # conforms.yml refuses one.
      - uses: actions/checkout@v4
        with:
          repository: LocalNewsImpact/lnic-contracts
          ref: ${{ github.job_workflow_sha }}
          path: .lnic-contracts
          sparse-checkout: src/lnic_contracts
      - name: coverage floor
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch coverage.xml >/dev/null 2>&1; then
            echo "::error::coverage.xml is tracked, so the floor would read a stale report"
            exit 1
          fi
          python .lnic-contracts/src/lnic_contracts/coverage_floor.py coverage.xml

  integration:
    name: integration
    if: inputs.integration
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ inputs.postgres-db }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: ${{ inputs.postgres-db }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: ${{ inputs.fetch-tags }}
          # `fetch-tags` needs history to hang the tags on; 0 is the
          # documented pairing. Kept at the default depth otherwise, so a
          # repository that does not ask for tags pays nothing.
          #
          # QUOTED, and it matters. GitHub expressions treat the number 0
          # as falsy, so `x && 0 || 1` evaluates to 1 whatever x is: the
          # checkout stayed shallow, no tags arrived, and `fetch-tags:
          # true` did nothing at all. '0' is a non-empty string and
          # therefore truthy, so the branch survives.
          fetch-depth: ${{ inputs.fetch-tags && '0' || '1' }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - run: ${{ inputs.install }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: make test-integration
