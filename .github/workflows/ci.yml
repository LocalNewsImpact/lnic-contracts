# This repository's own checks.
#
# It had none. Two applications import it, a rename here breaks both, and
# v0.2.0 was released from a laptop with nothing behind it but a local
# pytest run -- then the first two commits with CI attached went to main
# red, on things ruff names in under a second, because there was still no
# way to run ruff here.
#
# One target, `make check`, run by CI and by the pre-push hook
# (scripts/setup-hooks.sh). They cannot drift: if the hook passes, the
# push passes.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # `make check` is lint, tests, and the packaging check: the built
      # package has to carry the code and not only the version number.
      # datadesk's image reported 0.2.0 and carried v0.1.0's code, and
      # nothing installed the built package to notice.
      - run: make check
