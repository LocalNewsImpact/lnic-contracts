# This repository's own checks.
#
# It had none. Two applications import it, a rename here breaks both, and
# v0.2.0 was released from a laptop with nothing but a local pytest run
# behind it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" || pip install pytest ruff
      - name: ruff
        run: ruff check .
      - name: pytest
        run: python -m pytest -q

  # The package has to install from the URL consumers actually use, not
  # only from the working tree. datadesk's image reported version 0.2.0
  # and carried v0.1.0's code, and no test anywhere installed the tarball
  # to notice.
  installs-from-its-own-tag:
    name: Installs the way consumers install it
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the sdist and install it
        run: |
          pip install build
          python -m build --sdist
          pip install dist/*.tar.gz
      - name: What is installed is what is in the tree
        run: |
          cd /tmp
          python - <<'PY'
          import importlib.metadata as meta
          import inspect
          from lnic_contracts import review_note

          print("installed version:", meta.version("lnic-contracts"))
          # Every public name the module declares has to survive packaging.
          # A stale build directory or a src-layout mistake produces a
          # package with the new version number and the old code, which is
          # exactly what reached production on 4 September.
          missing = [
              name
              for name in ("build", "read", "question", "build_decision",
                           "record_decision", "is_answered")
              if not hasattr(review_note, name)
          ]
          if missing:
              raise SystemExit(f"packaged without: {', '.join(missing)}")
          print("public API present:", len(dict(inspect.getmembers(review_note))))
          PY
