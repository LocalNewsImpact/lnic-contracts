# A version bump is a release.
#
# `pyproject.toml` said 0.4.0 and there was no `v0.4.0` tag. Consumers
# install from `archive/refs/tags/v<version>.tar.gz`, so that version was
# released in name only: nothing could install it, and the repository
# said it had shipped something it had not. The bump and the tag were two
# steps and only one of them was in the pull request.
#
# So the tag follows the version, on merge to main, once the checks that
# guard main have passed. There is nothing left to remember.
#
# This is the package's own tag (`v1.2.3`), not the shared CI tag
# (`ci-v1.2.3`, release-ci.yml). Different things, different consumers:
# one is imported by two applications, the other is a workflow three
# repositories call.
name: Release the package

on:
  push:
    branches: [main]
    # A release can only follow a version, and the version lives here.
    paths: ["pyproject.toml"]

  # For a bump that merged before this workflow existed, and for a tag
  # deleted by hand. It refuses to move an existing tag either way.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-package
  cancel-in-progress: false      # never race two tags onto one repository

jobs:
  release:
    name: Tag the version in pyproject
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      released: ${{ steps.already.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags, to see what is already released

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(python -c "
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])
          ")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::pyproject says $VERSION"

      # Not an error. Most merges to main do not bump the version, and a
      # workflow that fails on the ordinary case is a workflow whose red
      # runs nobody reads.
      - name: Has it been released already?
        id: already
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "release=no" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.version.outputs.tag }} already exists; nothing to do"
          else
            echo "release=yes" >> "$GITHUB_OUTPUT"
          fi

      # The gate. Two applications import this and pin by tag; a tag
      # pointing at something red is installed by both before anyone
      # notices, and the pull request that would fix it installs it too.
      - name: Everything this repository checks
        if: steps.already.outputs.release == 'yes'
        run: make check

      - name: Tag it
        if: steps.already.outputs.release == 'yes'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Never -f. A tag consumers may already have installed must not
          # come to mean something else.
          git tag "${{ steps.version.outputs.tag }}" "${{ github.sha }}"
          git push origin "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Say what is in it
        if: steps.already.outputs.release == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          PREVIOUS="$(git tag -l 'v*.*.*' --sort=-v:refname | sed -n 2p)"
          NOTES="$(mktemp)"
          {
            echo "Install: \`lnic-contracts @ https://github.com/${{ github.repository }}/archive/refs/tags/$TAG.tar.gz\`"
            if [ -n "$PREVIOUS" ]; then
              echo
              echo "Since \`$PREVIOUS\`:"
              echo
              git log --format='- %s' "$PREVIOUS..$TAG"
            fi
          } > "$NOTES"
          gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"
          cat "$NOTES" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # The half that was still manual
  # ------------------------------------------------------------------
  #
  # Tagging a release published nothing to anybody: both consumers pin
  # the tarball by tag, so until their requirements line changes they go
  # on installing the old version. v0.5.0 and v0.6.0 each needed a hand
  # -written pull request in two repositories, and the release notes said
  # "consumers to follow" because following was a person's job.
  #
  # Dependabot cannot do this. The pin is a direct URL --
  # `lnic-contracts @ https://.../archive/refs/tags/v0.6.0.tar.gz` -- and
  # nothing tracks versions behind one of those.
  #
  # So the release opens the pull request. It does not merge it: the
  # consumer's own CI has to pass first, and that is the consumer's
  # gate, not this repository's.
  bump-consumers:
    name: ${{ matrix.repo }}
    needs: release
    if: needs.release.outputs.released == 'yes'
    runs-on: ubuntu-latest
    # One consumer's failure must not stop the other's, and neither must
    # fail the release that already happened.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: LocalNewsImpact/datadesk
            file: requirements.txt
          - repo: LocalNewsImpact/MizzouNewsCrawler
            file: requirements-base.txt
    steps:
      # A token with `contents: write` and `pull_requests: write` on the
      # consumers. The workflow's own GITHUB_TOKEN is scoped to this
      # repository and cannot push a branch to theirs.
      #
      # Absent, this says so and stops. A release that fails because
      # nobody has made a token yet would be a worse failure than a pull
      # request that has to be written by hand.
      - name: Is there a token?
        id: token
        env:
          TOKEN: ${{ secrets.CONSUMER_PR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::warning::CONSUMER_PR_TOKEN is not set; ${{ matrix.repo }} still needs its pin bumped by hand"
          else
            echo "have=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.have == 'yes'
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.CONSUMER_PR_TOKEN }}
          fetch-depth: 0

      - name: Open the bump
        if: steps.token.outputs.have == 'yes'
        env:
          GH_TOKEN: ${{ secrets.CONSUMER_PR_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
          FILE: ${{ matrix.file }}
          REPO: ${{ matrix.repo }}
        run: |
          set -euo pipefail
          PIN="lnic-contracts @ https://github.com/${{ github.repository }}/archive/refs/tags/"

          # Already there: a re-run, or somebody was faster.
          if grep -qF "${PIN}${TAG}.tar.gz" "$FILE"; then
            echo "::notice::$REPO already pins $TAG"
            exit 0
          fi
          if ! grep -qF "$PIN" "$FILE"; then
            echo "::warning::$REPO does not pin this package in $FILE"
            exit 0
          fi

          # One open pull request per repository is this project's rule:
          # every merge re-runs CI on all the others. If a bump is
          # already waiting, say so rather than stacking a second.
          # `gh pr list` has --head for an exact branch and no prefix
          # filter, so the prefix match is done here.
          OPEN="$(gh pr list --repo "$REPO" --state open --json headRefName \
                    --jq '[.[] | select(.headRefName
                          | startswith("deps/lnic-contracts-"))] | length' \
                    2>/dev/null || echo 0)"
          if [ "$OPEN" != "0" ]; then
            echo "::warning::$REPO already has an open lnic-contracts bump; $TAG not opened"
            exit 0
          fi

          BRANCH="deps/lnic-contracts-$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          # Python rather than sed. The pin is a URL full of characters
          # a regex and a shell each want to read; `sed -i` takes a
          # backup suffix on BSD and not on GNU; and this has to be
          # right the first time it runs unattended. This form is
          # testable on a laptop exactly as it runs on the runner.
          python3 - "$FILE" "$PIN" "$TAG" <<'PYEOF'
          import re, sys
          path, pin, tag = sys.argv[1], sys.argv[2], sys.argv[3]
          text = open(path).read()
          # Whichever version is pinned, not a known one: a consumer
          # may be several releases behind.
          pattern = re.escape(pin) + r"v\d+\.\d+\.\d+\.tar\.gz"
          new, n = re.subn(pattern, pin + tag + ".tar.gz", text)
          if n != 1:
              sys.exit(f"expected one pin in {path}, rewrote {n}")
          open(path, "w").write(new)
          print(f"pinned {tag} in {path}")
          PYEOF
          git add "$FILE"
          git commit -m "lnic-contracts $TAG

          Opened by the release that tagged it. Both consumers pin the
          tarball by tag, so a release reaches nobody until this line
          changes.

          The consumer's own CI is the gate: this is a pull request, not
          a merge."
          git push origin "$BRANCH"
          PR="$(gh pr create --repo "$REPO" --base main --head "$BRANCH" \
            --title "lnic-contracts $TAG" \
            --body "Opened by [lnic-contracts $TAG](https://github.com/${{ github.repository }}/releases/tag/$TAG).

          Both consumers pin the tarball by tag, so a release reaches nobody until this line changes. Dependabot cannot do it: the pin is a direct URL and nothing tracks versions behind one.

          Opened by the release workflow, which waits for this repository's required checks and lands it only if they pass. A red run leaves this open for a person.")"
          echo "::notice::opened $PR"

          # Wait for this repository's own checks, then land it.
          #
          # A pin bump carries no judgement. The version is already
          # decided and already tagged; the only open question is whether
          # this repository still passes with it, and that question has
          # an automated answer. Asking a person to click approve adds a
          # delay and no information -- which is why v0.5.0 and v0.6.0
          # each sat waiting for one.
          #
          # CI stays the gate. `--watch` blocks until every required
          # check has reported and exits non-zero if any failed, so the
          # step below is reached only on green, and a red run leaves the
          # pull request open for a person to read.
          if ! gh pr checks "$PR" --repo "$REPO" --watch --fail-fast; then
            echo "::warning::$REPO checks failed on $TAG; left open for a person"
            exit 0
          fi

          # The consumer requires an approving review and grants bypass
          # to organisation admins. This applies that same governance --
          # wait for green, then land -- to the one case with no
          # judgement in it. The checks are not skipped: they passed
          # above, and this refuses rather than forcing if the branch has
          # moved since.
          gh pr merge "$PR" --repo "$REPO" --squash --admin --delete-branch
          echo "::notice::landed $TAG in $REPO"
