# Publish a CI release, and move the major tag to it.
#
# Both, because they do different jobs.
#
#   ci-v1.2.3   an iteration, recorded. It never moves, so "what ran on
#               4 September" has an answer, and a consumer that needs to
#               pin exactly can.
#
#   ci-v1       what consumers actually pin. It follows, so a fix
#               reaches all three repositories without a pull request in
#               each of them.
#
# A moving major tag with no versions under it -- which is what this
# repository had -- records nothing: `ci-v1` was moved by hand twice in
# one day and there was no way to say what it had been. Versions with no
# moving tag propagate nothing: every fix becomes a bump in every
# consumer.
#
# The safety is not immutability. It is that the major tag only moves
# after the release's own checks pass, which is what this does.
name: Release CI

on:
  push:
    tags: ["ci-v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    name: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The gate the major tag waits behind. Three repositories point at
      # `ci-v1`; moving it to something red breaks all of them at once,
      # including the pull request that would fix it.
      - name: Everything this repository checks
        run: make check

      - name: Move the major tag
        run: |
          set -euo pipefail
          MAJOR="$(echo "${{ github.ref_name }}" | cut -d. -f1)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "${{ github.sha }}"
          git push -f origin "refs/tags/$MAJOR"
          echo "::notice::$MAJOR now points at ${{ github.ref_name }}"

      - name: Say what changed
        run: |
          PREVIOUS="$(git tag -l 'ci-v*.*.*' --sort=-v:refname | sed -n 2p)"
          {
            echo "## ${{ github.ref_name }}"
            if [ -n "$PREVIOUS" ]; then
              echo
              echo "Since \`$PREVIOUS\`:"
              echo
              git log --format='- %s' "$PREVIOUS..${{ github.ref_name }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
