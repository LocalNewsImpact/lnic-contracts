[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lnic-contracts"
version = "0.3.0"
description = "Shapes written by one LNIC service and read by another."
requires-python = ">=3.11"
dependencies = []

[project.urls]
Source = "https://github.com/LocalNewsImpact/lnic-contracts"

[project.optional-dependencies]
# The tools this repository's own checks run. Named here rather than in a
# requirements file so `pip install ".[dev]"` is the one way to get them,
# and so a CI step cannot quietly install nothing: an unknown extra is a
# warning to pip, and the fallback that was meant to catch it never ran.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

# Matches the toolchain in MizzouNewsCrawler, datadesk and NewsSourceDirectory,
# so a contract edited from any of them is formatted the same way.
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

# What `make test` measures. No fail_under here: the floor is
# lnic_contracts.coverage_floor, the same file every consumer runs, and
# conforms.yml refuses a second number in any repository, this one included.
[tool.coverage.run]
source = ["lnic_contracts"]

[tool.coverage.report]
show_missing = true
